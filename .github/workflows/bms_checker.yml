name: BMS Ticket Watcher

on:
  schedule:
     # Runs every 30 minutes, 24/7 daily (:00 and :30)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows you to manually trigger a test run anytime from the browser

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Ticket Checker
        run: python check_tickets.py
