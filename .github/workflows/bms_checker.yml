name: BMS Ticket Watcher

on:
  schedule:
    # Runs every 5 minutes, 24/7 daily
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Ticket Checker
        run: python check_tickets.py
